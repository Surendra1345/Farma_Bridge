server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Photo uploads are capped at 5 MB by the API; allow a little form overhead.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: /api/crop-listings -> http://backend:8000/crop-listings
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets have content hashes in their names, so cache them for long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
